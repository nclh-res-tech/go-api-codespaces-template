name: Template Setup

on:
  push:
    branches:
      - main

jobs:
  setup:
    # Only run if this is a new repo created from template (not the template itself)
    # and if the placeholder still exists (hasn't been replaced yet)
    if: github.repository != 'nclh-res-tech/go-api-codespaces-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if setup is needed
        id: check
        run: |
          if grep -q "{{MODULE_PATH}}" go.mod 2>/dev/null; then
            echo "needs_setup=true" >> $GITHUB_OUTPUT
            echo "Setup is needed - placeholders found"
          else
            echo "needs_setup=false" >> $GITHUB_OUTPUT
            echo "Setup not needed - placeholders already replaced"
          fi
      
      - name: Extract repo info
        if: steps.check.outputs.needs_setup == 'true'
        id: repo
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="${{ github.repository_owner }}"
          MODULE_PATH="github.com/${REPO_OWNER}/${REPO_NAME}"
          SERVICE_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "Module Path: $MODULE_PATH"
          echo "Service Name: $SERVICE_NAME"
      
      - name: Replace placeholders
        if: steps.check.outputs.needs_setup == 'true'
        run: |
          MODULE_PATH="${{ steps.repo.outputs.module_path }}"
          SERVICE_NAME="${{ steps.repo.outputs.service_name }}"
          
          echo "Replacing MODULE_PATH with: $MODULE_PATH"
          echo "Replacing SERVICE_NAME with: $SERVICE_NAME"
          
          find . -type f \( -name "*.go" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" -o -name "*.md" -o -name "Makefile" -o -name "Dockerfile" \) \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            -exec sed -i "s|{{MODULE_PATH}}|$MODULE_PATH|g" {} \;
          
          find . -type f \( -name "*.go" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" -o -name "*.md" -o -name "Makefile" -o -name "Dockerfile" \) \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            -exec sed -i "s|{{SERVICE_NAME}}|$SERVICE_NAME|g" {} \;
          
          echo "Placeholders replaced successfully"
      
      - name: Update go.mod
        if: steps.check.outputs.needs_setup == 'true'
        env:
          MODULE_PATH: ${{ steps.repo.outputs.module_path }}
        run: |
          echo "module $MODULE_PATH" > go.mod
          echo "" >> go.mod
          echo "go 1.22" >> go.mod
          echo "" >> go.mod
          echo "require (" >> go.mod
          echo "	github.com/gin-contrib/zap v0.2.0" >> go.mod
          echo "	github.com/gin-gonic/gin v1.9.1" >> go.mod
          echo "	github.com/go-playground/validator/v10 v10.19.0" >> go.mod
          echo "	github.com/google/uuid v1.6.0" >> go.mod
          echo "	github.com/knadh/koanf/parsers/yaml v0.1.0" >> go.mod
          echo "	github.com/knadh/koanf/providers/env v0.1.0" >> go.mod
          echo "	github.com/knadh/koanf/providers/file v0.1.0" >> go.mod
          echo "	github.com/knadh/koanf/v2 v2.1.0" >> go.mod
          echo "	github.com/prometheus/client_golang v1.19.0" >> go.mod
          echo "	github.com/swaggest/openapi-go v0.2.50" >> go.mod
          echo "	github.com/swaggest/swgui v1.8.0" >> go.mod
          echo "	go.opentelemetry.io/contrib/instrumentation/github.com/gin-gonic/gin/otelgin v0.49.0" >> go.mod
          echo "	go.opentelemetry.io/otel v1.24.0" >> go.mod
          echo "	go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc v1.24.0" >> go.mod
          echo "	go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp v1.24.0" >> go.mod
          echo "	go.opentelemetry.io/otel/exporters/prometheus v0.46.0" >> go.mod
          echo "	go.opentelemetry.io/otel/exporters/stdout/stdouttrace v1.24.0" >> go.mod
          echo "	go.opentelemetry.io/otel/sdk v1.24.0" >> go.mod
          echo "	go.opentelemetry.io/otel/sdk/metric v1.24.0" >> go.mod
          echo "	go.uber.org/zap v1.27.0" >> go.mod
          echo ")" >> go.mod
      
      - name: Remove setup files
        if: steps.check.outputs.needs_setup == 'true'
        run: |
          rm -f setup.sh
          rm -f .github/workflows/template-setup.yml
          rm -f .github/template-config.yml
          rmdir .github/workflows 2>/dev/null || true
      
      - name: Commit changes
        if: steps.check.outputs.needs_setup == 'true'
        env:
          MODULE_PATH: ${{ steps.repo.outputs.module_path }}
          SERVICE_NAME: ${{ steps.repo.outputs.service_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: Initialize project from template - Replaced placeholders with $MODULE_PATH and $SERVICE_NAME"
          git push
