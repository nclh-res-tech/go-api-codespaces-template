name: Template Setup

on:
  push:
    branches:
      - main

jobs:
  setup:
    # Only run if this is a new repo created from template (not the template itself)
    # and if the placeholder still exists (hasn't been replaced yet)
    if: github.repository != 'nclh-res-tech/go-api-codespaces-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if setup is needed
        id: check
        run: |
          if grep -q "{{MODULE_PATH}}" go.mod 2>/dev/null; then
            echo "needs_setup=true" >> $GITHUB_OUTPUT
            echo "Setup is needed - placeholders found"
          else
            echo "needs_setup=false" >> $GITHUB_OUTPUT
            echo "Setup not needed - placeholders already replaced"
          fi
      
      - name: Extract repo info
        if: steps.check.outputs.needs_setup == 'true'
        id: repo
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="${{ github.repository_owner }}"
          MODULE_PATH="github.com/${REPO_OWNER}/${REPO_NAME}"
          SERVICE_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "Module Path: $MODULE_PATH"
          echo "Service Name: $SERVICE_NAME"
      
      - name: Replace placeholders
        if: steps.check.outputs.needs_setup == 'true'
        run: |
          MODULE_PATH="${{ steps.repo.outputs.module_path }}"
          SERVICE_NAME="${{ steps.repo.outputs.service_name }}"
          
          echo "Replacing MODULE_PATH with: $MODULE_PATH"
          echo "Replacing SERVICE_NAME with: $SERVICE_NAME"
          
          find . -type f \( -name "*.go" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" -o -name "*.md" -o -name "Makefile" -o -name "Dockerfile" \) \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            -exec sed -i "s|{{MODULE_PATH}}|$MODULE_PATH|g" {} \;
          
          find . -type f \( -name "*.go" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" -o -name "*.md" -o -name "Makefile" -o -name "Dockerfile" \) \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            -exec sed -i "s|{{SERVICE_NAME}}|$SERVICE_NAME|g" {} \;
          
          echo "Placeholders replaced successfully"
      
      - name: Set up Go
        if: steps.check.outputs.needs_setup == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Update go.mod and generate go.sum
        if: steps.check.outputs.needs_setup == 'true'
        env:
          MODULE_PATH: ${{ steps.repo.outputs.module_path }}
        run: |
          # Update go.mod with correct module path
          sed -i "s|module {{MODULE_PATH}}|module $MODULE_PATH|g" go.mod
          
          # Run go mod tidy to resolve dependencies and generate go.sum
          go mod tidy
      
      - name: Remove setup files
        if: steps.check.outputs.needs_setup == 'true'
        run: |
          rm -f setup.sh
          rm -f .github/workflows/template-setup.yml
          rm -f .github/template-config.yml
          rmdir .github/workflows 2>/dev/null || true
      
      - name: Commit changes
        if: steps.check.outputs.needs_setup == 'true'
        env:
          MODULE_PATH: ${{ steps.repo.outputs.module_path }}
          SERVICE_NAME: ${{ steps.repo.outputs.service_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: Initialize project from template - Replaced placeholders with $MODULE_PATH and $SERVICE_NAME"
          git push
