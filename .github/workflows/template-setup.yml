name: 🚀 Initialize Project from Template

on:
  push:
    branches:
      - main

jobs:
  initialize:
    name: Configure project settings
    # Only run on repos created from template (not the template itself)
    # Skip if this is a commit from github-actions bot (to prevent loops)
    if: |
      github.repository != 'nclh-res-tech/go-api-codespaces-template' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Check if initialization is needed
        id: check
        run: |
          if grep -q "{{MODULE_PATH}}" go.mod 2>/dev/null; then
            echo "needs_init=true" >> $GITHUB_OUTPUT
          else
            echo "needs_init=false" >> $GITHUB_OUTPUT
            echo "✅ Project already initialized - skipping"
          fi
      
      - name: 🛠️ Initialize project
        if: steps.check.outputs.needs_init == 'true'
        run: |
          # Extract repository info
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="${{ github.repository_owner }}"
          MODULE_PATH="github.com/${REPO_OWNER}/${REPO_NAME}"
          SERVICE_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          
          echo "📦 Configuring project:"
          echo "   Module: $MODULE_PATH"
          echo "   Service: $SERVICE_NAME"
          
          # Replace placeholders in all relevant files
          find . -type f \( -name "*.go" -o -name "go.mod" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" -o -name "*.md" -o -name "Makefile" -o -name "Dockerfile" \) \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            -exec sed -i "s|{{MODULE_PATH}}|$MODULE_PATH|g" {} \;
          
          find . -type f \( -name "*.go" -o -name "go.mod" -o -name "*.yaml" -o -name "*.yml" -o -name "*.json" -o -name "*.md" -o -name "Makefile" -o -name "Dockerfile" \) \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            -exec sed -i "s|{{SERVICE_NAME}}|$SERVICE_NAME|g" {} \;
          
          echo "✅ Placeholders replaced"
          
          # Save for later steps
          echo "MODULE_PATH=$MODULE_PATH" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV

      - name: 🐹 Set up Go
        if: steps.check.outputs.needs_init == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: 📦 Resolve dependencies
        if: steps.check.outputs.needs_init == 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          # Prevent Go from auto-upgrading the toolchain
          go mod tidy -compat=1.22
          echo "✅ Dependencies resolved and go.sum generated"
      
      - name: 🧹 Clean up template files
        if: steps.check.outputs.needs_init == 'true'
        run: |
          rm -f setup.sh
          rm -f .github/workflows/template-setup.yml
          rm -f .github/template-config.yml
          rmdir .github/workflows 2>/dev/null || true
          echo "✅ Template files removed"
      
      - name: 💾 Commit changes
        if: steps.check.outputs.needs_init == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🎉 Initialize ${{ env.SERVICE_NAME }} [skip ci]

          Automatically configured from go-api-codespaces-template:
          • Module path: ${{ env.MODULE_PATH }}
          • Service name: ${{ env.SERVICE_NAME }}
          • Dependencies resolved (go.sum generated)
          • Template setup files removed"
          git push
          
          echo ""
          echo "🎉 Project initialized successfully!"
          echo ""
          echo "Next steps:"
          echo "  1. Open in GitHub Codespaces"
          echo "  2. Run: make run"
          echo ""
